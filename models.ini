# Router Mode Global settings applied to all models unless explicitly overridden
[*]
# do not show models from the hf cache since that will be duplicates
dedup-cache-models = 1
flash-attn = true
batch-size = 4096
ctx-size = 163840

# not more than 2 CPU threads (GPU memory contention)
threads = 2

# General purpose dense model
[qwen38]
hf-repo = unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL
# Inherits all global values
temp = 1.0
top-k = 20
top-p = 0.95
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
# KV Cache Quantization parameters
cache-type-k = q8_0
cache-type-v = q4_0
# MTP (doubles token generation rate)
spec-type = draft-mtp
spec-draft-n-max = 2
tools = all

# General purpose faster dense model
[swift15]
hf-repo = ukisai/Swift-1.5-Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_S
# Inherits all global values
temp = 1.0
top-k = 20
top-p = 0.95
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
# MTP (doubles token generation rate)
spec-type = draft-mtp
spec-draft-n-max = 2
tools = all

# OCR specialist (Overrides parameters to restrict context and lower temperature)
[LightOn]
hf-repo = staghado/LightOnOCR-2-1B-Q8_0-GGUF
ctx-size = 16384
temp = 0.2
top-k = 0
top-p = 0.9
